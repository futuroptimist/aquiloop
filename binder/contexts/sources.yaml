      "accessed": "2026-09-26",
      "supports": [
        "pacifica_zip_majority_zone",
        "lookup_reproduction"
      ],
      "applicability": "The table behind the USDA map's ZIP search returns 10a (30 to 35 °F/-1.1 to 1.7 °C) as the majority 2023 class for ZIP 94044. A ZIP-majority result is not a point lookup and does not establish the zone or measured minimum at every Pacifica property."
    },
