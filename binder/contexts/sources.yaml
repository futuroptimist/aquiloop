        "coastal_influence",
        "fog_and_local_variation"
      ],
      "applicability": "Regional guidance for San Mateo and San Francisco Counties: dry summers, mild winters, bay/ocean influence, and microclimates ranging from cool coastal fog belts to warmer inland areas. It is not a measurement of a Pacifica garden, indoor room, or aquarium."
