      "applicability": "Defines the current national map as the 2023 edition, describes zones as average annual extreme minimum winter temperature bands, and directs users to search by ZIP code or click a map location. It does not describe a particular yard or a plant's preferred growing temperature."
    },
    {
      "key": "USDA-PHZM-USE",
      "authority": "United States Department of Agriculture, Agricultural Research Service",
      "title": "How to Use the Maps",
      "url": "https://planthardiness.ars.usda.gov/pages/how-to-use-the-maps",
      "accessed": "2026-09-26",
      "supports": [
        "climate_reference_period",
        "zone_definition",
        "map_limits",
        "microclimates"
      ],
      "applicability": "Defines 10-degree-Fahrenheit zones and 5-degree-Fahrenheit half zones from 1991–2020 average annual extreme minimum winter temperatures. It says the map is a general perennial-plant guide and that wind, soil, moisture, light, exposure duration, and fine-scale microclimates also affect survival."
    },
    {
      "key": "USDA-PHZM-ZIP",
