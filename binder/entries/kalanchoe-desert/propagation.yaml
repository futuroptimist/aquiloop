      "claim_id": "sequential-procedure",
      "metric": "propagation_steps",
      "description": "1. Clean sharp pruners and prepare a small draining pot with cactus mix or perlite. 2. Select a firm healthy 3–6 in stem in spring or summer. 3. Cut cleanly and retain the top orientation. 4. Remove leaves from the lower half; air-dry until the cut is callused. 5. Insert the lower stem upright and firm gently. 6. Keep in bright indirect light with ventilation; keep medium barely moist, never saturated. 7. Check for new growth and resistance to a very gentle tug; stop and inspect if the base softens. 8. Transfer after roots hold the medium and growth resumes, then acclimate gradually to ordinary light and watering.",
