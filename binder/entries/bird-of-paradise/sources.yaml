      "applicability": "Species account for S. reginae. Supports Florida outdoor cold/light context; division from four-to-five-shoot clumps; at least three months to division establishment and 1–2 years to flowering; and the sequential seed pretreatment, 1–12-month germination, two-true-leaf pot-up, 2–3-month later transfer, and 3–5-year flowering milestones. Do not transfer these details to S. nicolai or treat Florida cold tolerance as a Pacifica site measurement."
