      "claim_id": "sequential-procedure",
      "metric": "propagation_steps",
      "description": "1. Clean sharp pruners and a draining pot; add cactus mix or perlite. 2. Select a firm, healthy terminal shoot. 3. Cut a 3–6 in stem cleanly. 4. Remove leaves from the lower half and air-dry the end until callused. 5. Insert the callused lower stem upright and firm the medium lightly. 6. Keep in bright indirect light, protect from temperature extremes, and keep the medium barely moist rather than saturated. 7. Check for resistance to a very gentle tug and new growth; inspect instead for darkening, softness, or collapse. 8. Pot into established-plant mix after roots hold the medium and growth resumes; increase outdoor exposure gradually.",
