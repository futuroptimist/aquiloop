    },
    {
      "claim_id": "inspect-establishment",
      "metric": "procedure_step",
      "description": "6. Inspect without tugging: first note whether the cut fragment stays intact, then record genuinely new leaves or shoot extension. Continue observing when no interval is supported rather than declaring success or failure by a deadline.",
      "applicable_taxon": "provisional Ceratophyllum demersum",
      "propagation_method": "fragmentation",
