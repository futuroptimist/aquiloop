  "entry": "aquarium-hornwort",
  "worksheet": "propagation",
  "claims": [
    {
      "claim_id": "primary-method",
      "metric": "propagation_method",
      "description": "Use aquatic fragmentation as the primary home method: trim a side shoot or stem tip and keep the fragment submerged, preferably floating. This is general guidance for candidate C. demersum, not a diagnosis or identity confirmation.",
      "applicable_taxon": "provisional Ceratophyllum demersum; specimen species and aquarium trade selection unverified",
      "propagation_method": "fragmentation",
      "life_stage": "fragment",
      "growing_conditions": "Freshwater aquarium; source plant and tank conditions must be checked first",
      "geographic_context": "not_applicable",
      "evidence_category": "published",
      "provenance": {
        "source_refs": ["HOR-WA", "HOR-ACO-CARE"],
        "applicability": "Washington lists plant fragments as species propagation; Aquarium Co-Op describes side-shoot or stem-tip trimming for home aquaria."
      }
    },
    {
      "claim_id": "prepare-work-area",
      "metric": "procedure_step",
      "description": "1. Prepare clean scissors, a clean water-filled holding container, and a fine net. Record current temperature, light schedule, flow, livestock, and water-test results before changing the tank.",
      "applicable_taxon": "provisional Ceratophyllum demersum",
      "propagation_method": "fragmentation",
      "life_stage": "parent and fragment",
      "growing_conditions": "Use aquarium water in the holding container; owner tank conditions presently unknown",
      "geographic_context": "not_applicable",
      "evidence_category": "proposed",
      "provenance": {
        "source_refs": ["HOR-ACO-CARE", "HOR-NYDEC-DISPOSAL"],
        "applicability": "The care source identifies sensitivity to major water changes and loose needles; NYSDEC addresses containment of aquatic plant fragments.",
        "derivation": "Clean cutting and capture tools keep the operation controlled, while recording rather than inventing tank conditions preserves a useful baseline."
      }
    },
    {
      "claim_id": "select-starting-material",
      "metric": "procedure_step",
      "description": "2. Select an intact, actively growing side shoot or stem tip. Do not infer health or species from the overview photograph; inspect the live material for intact whorls and avoid already collapsing sections.",
      "applicable_taxon": "provisional Ceratophyllum demersum",
      "propagation_method": "fragmentation",
      "life_stage": "parent",
      "growing_conditions": "Live aquarium inspection immediately before trimming",
      "geographic_context": "not_applicable",
      "evidence_category": "proposed",
      "provenance": {
        "source_refs": ["HOR-ACO-CARE"],
        "applicability": "The source specifies a side shoot or top of a tall stem and distinguishes new leaves/shoots from shedding.",
        "derivation": "The proposed readiness check operationalizes the cited propagule choice without diagnosing the photographed specimen."
      }
    },
    {
      "claim_id": "make-cut",
      "metric": "procedure_step",
      "description": "3. Support the stem in the holding container and make one gentle cut that frees the selected side shoot or top section. Avoid crushing or repeated handling, because C. demersum stems break easily.",
      "applicable_taxon": "provisional Ceratophyllum demersum",
      "propagation_method": "fragmentation",
      "life_stage": "fragment",
      "growing_conditions": "Fragment remains wet and submerged during handling",
      "geographic_context": "not_applicable",
      "evidence_category": "proposed",
      "provenance": {
        "source_refs": ["HOR-WA", "HOR-ACO-CARE"],
        "applicability": "Washington documents easily broken stems; Aquarium Co-Op supports trimming a side shoot or stem top.",
        "derivation": "A supported single cut minimizes accidental fragments while carrying out the cited home propagation method."
      }
    },
    {
      "claim_id": "fragment-length",
      "metric": "fragment_length",
      "quantity": {"kind": "unknown", "reason": "The reviewed home-aquarium source specifies a side shoot or stem tip but gives no minimum fragment length, and wild fragmentation does not establish a household cutting size."},
      "applicable_taxon": "provisional Ceratophyllum demersum",
      "propagation_method": "fragmentation",
      "life_stage": "fragment",
      "growing_conditions": "Freshwater aquarium",
      "geographic_context": "not_applicable",
      "evidence_category": "unknown",
      "provenance": {}
    },
    {
      "claim_id": "place-fragment",
      "metric": "procedure_step",
      "description": "4. Return the fragment to the aquarium and let it float freely below or at the surface, clear of the filter intake. Floating is preferred; optional bottom or hardscape support must not be called rooting, and a buried or attached end can rot.",
      "applicable_taxon": "provisional Ceratophyllum demersum; bottom-placement detail partly selection-specific",
      "propagation_method": "fragmentation",
      "life_stage": "fragment",
      "growing_conditions": "Freshwater aquarium with surface gas exchange and gentle flow",
      "geographic_context": "not_applicable",
      "evidence_category": "published",
      "provenance": {
        "source_refs": ["HOR-WA", "HOR-TROP", "HOR-ACO-CARE"],
        "applicability": "Sources support free floating and optional bottom/attachment placement while consistently describing the plant as rootless; Aquarium Co-Op warns of end rot."
      }
    },
    {
      "claim_id": "maintain-fragment",
      "metric": "procedure_step",
      "description": "5. Keep the fragment fully aquatic under the recorded tank schedule, gentle flow, and stable livestock-compatible water. Do not add fertilizer or change temperature, chemistry, lamp runtime, or CO2 solely for this worksheet; first compare measurements and plant response with the setup claims.",
      "applicable_taxon": "provisional Ceratophyllum demersum",
      "propagation_method": "fragmentation",
      "life_stage": "fragment",
      "growing_conditions": "Owner freshwater aquarium; measurements and livestock unknown",
