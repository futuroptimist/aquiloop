      "evidence_category": "proposed",
      "provenance": {
        "source_refs": ["HOR-ACO-CARE"],
        "applicability": "The source supports broad temperature tolerance, gentle flow, low-to-high light, no required CO2 injection, nutrient use, and shedding after major changes.",
        "derivation": "Holding known conditions stable makes new shoot growth observable and avoids converting broad tolerances into unsupported tank targets."
      }
    },
    {
      "claim_id": "fragment-regrowth",
      "metric": "rooting_or_regrowth",
      "description": "A fragment can form a new plant. Count new leaves or a new/elongating shoot produced after cutting as regrowth; a broken-off piece alone is fragmentation, not evidence of successful establishment.",
