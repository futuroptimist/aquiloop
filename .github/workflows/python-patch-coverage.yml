name: Advisory Python patch coverage

on:
  pull_request:
    paths:
      - 'scripts/*.py'
      - 'tests/binder/**'
      - 'tests/publication/**'
      - 'tests/coverage/**'
      - 'requirements-binder.txt'
      - '.coveragerc'
      - 'codecov.yml'
      - '.github/workflows/python-patch-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'tests/binder/**'
      - 'tests/publication/**'
      - 'tests/coverage/**'
      - 'requirements-binder.txt'
      - '.coveragerc'
      - 'codecov.yml'
      - '.github/workflows/python-patch-coverage.yml'

permissions:
  contents: read

jobs:
  report:
    name: Measure Python coverage (advisory)
    if: ${{ github.repository == 'futuroptimist/aquiloop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    outputs:
      report_ready: ${{ steps.ready.outputs.report_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      - name: Install the binder rendering toolchain
        run: |
          set -Eeuo pipefail
          # Match the binder validation runner's snapshot and pinned package versions.
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'SOURCES'
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/20260828T000000Z/
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y \
            fonts-texgyre=20180621-6 \
            poppler-utils=24.02.0-1ubuntu9.9 \
            texlive-binaries=2023.20230311.66589-9build3 \
            texlive-fonts-recommended=2023.20240207-1 \
            texlive-latex-base=2023.20240207-1 \
            texlive-luatex=2023.20240207-1 \
            texlive-pictures=2023.20240207-1
      - name: Install the coverage toolchain
        run: python -m pip install --disable-pip-version-check --requirement requirements-binder.txt coverage==7.10.7
      - name: Check advisory report and upload guards
        run: python -m unittest discover -s tests/coverage -v
      - name: Measure both existing regression suites
        run: |
          set -euo pipefail
          export COVERAGE_FILE="$RUNNER_TEMP/aquiloop-python.coverage"
          python -m coverage run -m unittest discover -s tests/publication -v 2>&1 | tee "$RUNNER_TEMP/publication-tests.log"
          python -m coverage run --append -m unittest discover -s tests/binder -v 2>&1 | tee "$RUNNER_TEMP/binder-tests.log"
          for log in "$RUNNER_TEMP/publication-tests.log" "$RUNNER_TEMP/binder-tests.log"; do
            grep -Eq '^Ran [1-9][0-9]* tests? in ' "$log"
            if grep -Eq 'skipped=[1-9][0-9]*' "$log"; then
              echo '::error::A regression suite skipped tests; withholding the coverage report.'
              exit 1
            fi
          done
          python -m coverage xml -o build/coverage/python.xml scripts/*.py
      - name: Retain the coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aquiloop-python-coverage
          path: build/coverage/python.xml
          if-no-files-found: error
          retention-days: 7
      - name: Signal that both suites completed
        id: ready
        run: echo 'report_ready=true' >> "$GITHUB_OUTPUT"
      - name: Explain why coverage is unavailable
        if: ${{ failure() }}
        run: echo '::warning::Advisory coverage generation failed. No partial report was sent to Codecov.'

  upload_trusted:
    name: Upload trusted Python patch coverage via OIDC (advisory)
    needs: report
    if: >-
      ${{ needs.report.outputs.report_ready == 'true' &&
          github.repository == 'futuroptimist/aquiloop' &&
          github.actor != 'dependabot[bot]' &&
          !endsWith(github.actor, '[bot]') &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            github.event.pull_request.user.type == 'User')) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the report from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aquiloop-python-coverage
          path: ${{ runner.temp }}/aquiloop-coverage
      - name: Upload the Python coverage report
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ runner.temp }}/aquiloop-coverage/python.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Explain the advisory upload failure
        if: ${{ failure() }}
        run: echo '::warning::Advisory Codecov upload failed. The coverage report remains available in Actions.'

  upload_fork:
    name: Upload public fork Python patch coverage without a token (advisory)
    needs: report
    if: >-
      ${{ needs.report.outputs.report_ready == 'true' &&
          github.repository == 'futuroptimist/aquiloop' &&
          github.event_name == 'pull_request' &&
          toJSON(github.event.repository.private) == 'false' &&
          github.event.pull_request.head.repo.full_name != '' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the report from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aquiloop-python-coverage
          path: ${{ runner.temp }}/aquiloop-coverage
      - name: Upload the Python coverage report
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ runner.temp }}/aquiloop-coverage/python.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Explain the advisory upload failure
        if: ${{ failure() }}
        run: echo '::warning::Advisory Codecov upload failed. The coverage report remains available in Actions.'
