name: Build care binder draft

on:
  pull_request:
    paths:
      - 'binder/**'
      - 'scripts/build_binder.py'
      - 'scripts/prepare_binder_photo.py'
      - 'tests/binder/**'
      - 'docs/design/care-binder.md'
      - 'requirements-binder.txt'
      - '.github/workflows/binder.yml'
  push:
    branches: [main]
    paths:
      - 'binder/**'
      - 'scripts/build_binder.py'
      - 'scripts/prepare_binder_photo.py'
      - 'tests/binder/**'
      - 'docs/design/care-binder.md'
      - 'requirements-binder.txt'
      - '.github/workflows/binder.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-draft:
    name: Validate and build draft PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PDF: build/binder/aquiloop-binder-draft.pdf
      ARTIFACT_NAME: aquiloop-binder-draft
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements-binder.txt

      - name: Install LuaLaTeX and Poppler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            texlive-luatex texlive-latex-base texlive-latex-recommended \
            texlive-pictures fonts-texgyre poppler-utils

      - name: Install pinned Python dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-binder.txt

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          python --version | tee /dev/stderr | grep -Fx 'Python 3.12.13'
          python - <<'PY'
          import PIL, pypdf
          assert PIL.__version__ == "12.3.0", PIL.__version__
          assert pypdf.__version__ == "6.18.1", pypdf.__version__
          print(f"Pillow {PIL.__version__}")
          print(f"pypdf {pypdf.__version__}")
          PY
          lualatex --version | tee /dev/stderr | sed -n '1p' | grep -F 'LuaHBTeX, Version 1.17.0 (TeX Live 2023/Debian)'
          pdfinfo -v 2>&1 | tee /dev/stderr | sed -n '1p' | grep -F 'pdfinfo version 24.02.0'
          pdftoppm -v 2>&1 | tee /dev/stderr | sed -n '1p' | grep -F 'pdftoppm version 24.02.0'

      - name: Compile binder Python sources and tests
        run: python -m compileall -q scripts/build_binder.py scripts/prepare_binder_photo.py tests/binder

      - name: Run binder regression suite
        run: python -m unittest discover -s tests/binder -v

      - name: Build twice and verify deterministic output
        run: |
          set -euo pipefail
          python scripts/build_binder.py --manifest binder/manifest.yaml --mode draft --output build/binder/aquiloop-binder-draft.pdf
          first_sha256="$(sha256sum "$PDF" | cut -d' ' -f1)"
          python scripts/build_binder.py --manifest binder/manifest.yaml --mode draft --output build/binder/aquiloop-binder-draft.pdf
          second_sha256="$(sha256sum "$PDF" | cut -d' ' -f1)"
          printf 'first sha256:  %s\nsecond sha256: %s\n' "$first_sha256" "$second_sha256"
          test "$first_sha256" = "$second_sha256"

      - name: Validate PDF boxes and render at 150 DPI
        run: |
          set -euo pipefail
          mkdir -p build/binder/render/color build/binder/render/grayscale
          pdfinfo -box "$PDF" | tee build/binder/pdfinfo.txt
          python - <<'PY'
          import re
          import subprocess

          pdf = "build/binder/aquiloop-binder-draft.pdf"
          expected_box = (0.0, 0.0, 612.0, 792.0)
          for page in range(1, 7):
              report = subprocess.check_output(
                  ["pdfinfo", "-f", str(page), "-l", str(page), "-box", pdf],
                  text=True,
              )
              assert re.search(r"^Pages:\s+6$", report, re.MULTILINE), report
              prefix = rf"Page\s+{page}\s+"
              assert re.search(rf"^{prefix}rot:\s+0$", report, re.MULTILINE), report
              for box_name in ("MediaBox", "CropBox"):
                  match = re.search(
                      rf"^{prefix}{box_name}:\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)$",
                      report,
                      re.MULTILINE,
                  )
                  assert match and tuple(map(float, match.groups())) == expected_box, report
          print("pdfinfo: 6 pages; every MediaBox/CropBox is 0 0 612 792; every rotation is 0")
          PY
          pdftoppm -r 150 -png "$PDF" build/binder/render/color/page >/dev/null
          pdftoppm -r 150 -png -gray "$PDF" build/binder/render/grayscale/page >/dev/null
          test "$(find build/binder/render/color -type f -name '*.png' | wc -l)" -eq 6
          test "$(find build/binder/render/grayscale -type f -name '*.png' | wc -l)" -eq 6
          echo 'Rendered 6 color and 6 grayscale pages at 150 DPI.'

      - name: Confirm generated outputs are not tracked
        run: |
          set -euo pipefail
          test -z "$(git ls-files build/)"
          git diff --check
          sha256sum "$PDF"

      - name: Upload combined draft PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PDF }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
