name: Build care binder draft

on:
  pull_request:
    paths: &binder-paths
      - 'binder/**'
      - 'scripts/build_binder.py'
      - 'scripts/prepare_binder_photo.py'
      - 'tests/binder/**'
      - 'docs/design/care-binder.md'
      - 'requirements-binder.txt'
      - '.github/workflows/binder.yml'
  push:
    branches: [main]
    paths: *binder-paths
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-draft:
    name: Validate and build six-page draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements-binder.txt

      - name: Install pinned Python and system toolchains
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-binder.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            fonts-texgyre=20180621-6 \
            poppler-utils=24.02.0-1ubuntu9.9 \
            texlive-fonts-recommended=2023.20240207-1 \
            texlive-latex-extra=2023.20240207-1 \
            texlive-luatex=2023.20240207-1

      - name: Report and verify tool versions
        run: |
          set -euo pipefail
          python --version | tee /dev/stderr | grep -Fx 'Python 3.12.13'
          python - <<'PY'
          import PIL, pypdf
          assert PIL.__version__ == "12.3.0", PIL.__version__
          assert pypdf.__version__ == "6.18.1", pypdf.__version__
          print(f"Pillow {PIL.__version__}")
          print(f"pypdf {pypdf.__version__}")
          PY
          command -v lualatex pdfinfo pdftoppm
          lualatex --version | head -n 2
          pdfinfo -v 2>&1 | head -n 1
          pdftoppm -v 2>&1 | head -n 1
          dpkg-query -W -f='${Package}=${Version}\n' \
            fonts-texgyre poppler-utils texlive-fonts-recommended texlive-latex-extra texlive-luatex

      - name: Compile and test binder code
        run: |
          set -euo pipefail
          python -m compileall -q scripts/build_binder.py scripts/prepare_binder_photo.py tests/binder
          python -m unittest discover -s tests/binder -v

      - name: Build draft twice and validate PDF
        run: |
          set -euo pipefail
          mkdir -p build/binder build/binder-diagnostics
          python scripts/build_binder.py --manifest binder/manifest.yaml --mode draft \
            --output build/binder-diagnostics/first.pdf
          python scripts/build_binder.py --manifest binder/manifest.yaml --mode draft \
            --output build/binder/aquiloop-binder-draft.pdf
          sha256sum build/binder-diagnostics/first.pdf \
            build/binder/aquiloop-binder-draft.pdf | tee build/binder-diagnostics/sha256.txt
          cmp build/binder-diagnostics/first.pdf build/binder/aquiloop-binder-draft.pdf

          pdfinfo -box build/binder/aquiloop-binder-draft.pdf | tee build/binder-diagnostics/pdfinfo.txt
          for page in 1 2 3 4 5 6; do
            pdfinfo -f "$page" -l "$page" -box build/binder/aquiloop-binder-draft.pdf
          done | tee build/binder-diagnostics/page-boxes.txt
          test "$(awk '/^Pages:/ {print $2}' build/binder-diagnostics/pdfinfo.txt)" = 6
          test "$(grep -Ec '^Page +[1-6] MediaBox: +0\.00 +0\.00 +612\.00 +792\.00$' build/binder-diagnostics/page-boxes.txt)" = 6
          test "$(grep -Ec '^Page +[1-6] CropBox: +0\.00 +0\.00 +612\.00 +792\.00$' build/binder-diagnostics/page-boxes.txt)" = 6
          test "$(grep -Ec '^Page +[1-6] rot: +0$' build/binder-diagnostics/page-boxes.txt)" = 6

          pdftoppm -r 150 -png build/binder/aquiloop-binder-draft.pdf \
            build/binder-diagnostics/color >/dev/null
          pdftoppm -r 150 -gray -png build/binder/aquiloop-binder-draft.pdf \
            build/binder-diagnostics/grayscale >/dev/null
          test "$(find build/binder-diagnostics -name 'color-*.png' | wc -l)" = 6
          test "$(find build/binder-diagnostics -name 'grayscale-*.png' | wc -l)" = 6

      - name: Check repository cleanliness
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git ls-files build)"
          rm -rf scripts/__pycache__ tests/binder/__pycache__
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload combined draft PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aquiloop-binder-draft
          path: build/binder/aquiloop-binder-draft.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
