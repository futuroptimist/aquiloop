name: Build care binder draft

on:
  pull_request:
    paths:
      - 'binder/**'
      - 'scripts/build_binder.py'
      - 'scripts/prepare_binder_photo.py'
      - 'tests/binder/**'
      - 'docs/design/care-binder.md'
      - 'requirements-binder.txt'
      - '.github/workflows/binder.yml'
  push:
    branches: [main]
    paths:
      - 'binder/**'
      - 'scripts/build_binder.py'
      - 'scripts/prepare_binder_photo.py'
      - 'tests/binder/**'
      - 'docs/design/care-binder.md'
      - 'requirements-binder.txt'
      - '.github/workflows/binder.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Validate and build draft PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements-binder.txt

      - name: Install LuaLaTeX and Poppler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-texgyre=20180621-6 \
            poppler-utils=24.02.0-1ubuntu9.9 \
            texlive-fonts-recommended=2023.20240207-1 \
            texlive-latex-base=2023.20240207-1 \
            texlive-luatex=2023.20240207-1 \
            texlive-pictures=2023.20240207-1
          command -v lualatex
          command -v pdfinfo
          command -v pdftoppm

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-binder.txt

      - name: Report and verify toolchain
        run: |
          set -euo pipefail
          python --version
          python - <<'PY'
          import PIL, pypdf
          assert PIL.__version__ == "12.3.0", PIL.__version__
          assert pypdf.__version__ == "6.18.1", pypdf.__version__
          print(f"Pillow {PIL.__version__}")
          print(f"pypdf {pypdf.__version__}")
          PY
          lualatex --version | head -n 1
          pdfinfo -v 2>&1 | head -n 1
          pdftoppm -v 2>&1 | head -n 1

      - name: Compile-check binder Python
        run: python -m compileall -q scripts/build_binder.py scripts/prepare_binder_photo.py tests/binder

      - name: Run complete binder regression suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/binder -v 2>&1 | tee build-binder-tests.log
          grep -Eq '^Ran 41 tests in ' build-binder-tests.log
          ! grep -Eq 'skipped=[1-9][0-9]*' build-binder-tests.log

      - name: Build combined six-page draft
        run: |
          python scripts/build_binder.py --manifest binder/manifest.yaml --mode draft \
            --output build/binder/aquiloop-binder-draft.pdf
          sha256sum build/binder/aquiloop-binder-draft.pdf

      - name: Validate PDF boxes, pages, and rotation
        run: |
          set -euo pipefail
          pdfinfo -box build/binder/aquiloop-binder-draft.pdf | tee build/binder/pdfinfo.txt
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          pdf = Path("build/binder/aquiloop-binder-draft.pdf")
          reader = PdfReader(pdf)
          assert len(reader.pages) == 6, len(reader.pages)
          for number, page in enumerate(reader.pages, 1):
              media = tuple(float(value) for value in (*page.mediabox.lower_left, *page.mediabox.upper_right))
              crop = tuple(float(value) for value in (*page.cropbox.lower_left, *page.cropbox.upper_right))
              assert media == (0, 0, 612, 792), (number, "MediaBox", media)
              assert crop == (0, 0, 612, 792), (number, "CropBox", crop)
              assert (page.get("/Rotate") or 0) == 0, (number, "rotation")
          print("validated 6 pages: MediaBox/CropBox 0 0 612 792; rotation 0")
          PY

      - name: Render 150-DPI color and grayscale diagnostics
        run: |
          set -euo pipefail
          mkdir -p build/binder/render-color build/binder/render-gray
          pdftoppm -r 150 -png build/binder/aquiloop-binder-draft.pdf build/binder/render-color/page >/dev/null
          pdftoppm -r 150 -gray -png build/binder/aquiloop-binder-draft.pdf build/binder/render-gray/page >/dev/null
          test "$(find build/binder/render-color -type f -name '*.png' | wc -l)" -eq 6
          test "$(find build/binder/render-gray -type f -name '*.png' | wc -l)" -eq 6

      - name: Confirm generated output is untracked
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git ls-files build/)"
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload combined draft binder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aquiloop-binder-draft
          path: build/binder/aquiloop-binder-draft.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
